
<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Wordbox Smart</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0e1425;
  color: #f5f7ff;
  font: 16px system-ui;
}

main {
  max-width: 580px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 26px;
}

p {
  color: #bdc9e0;
  line-height: 1.8;
}

.upload {
  display: block;
  background: #6c78f4;
  border-radius: 15px;
  padding: 18px;
  text-align: center;
  font-weight: 800;
  cursor: pointer;
}

#file {
  display: none;
}

.panel {
  background: #1b2744;
  padding: 15px;
  border-radius: 18px;
  margin-top: 18px;
}

.stage {
  display: none;
  margin-top: 12px;
}

.stage img {
  width: 100%;
  display: block;
  border-radius: 12px;
}

#status {
  padding: 12px;
  border-radius: 10px;
  background: #233757;
  margin: 12px 0;
  line-height: 1.7;
}

#words {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.word {
  background: #2b3b60;
  border-radius: 12px;
  padding: 14px 8px;
  text-align: center;
  font-size: 21px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.note {
  font-size: 13px;
}

select {
  width: 100%;
  padding: 12px;
  background: #2b3b60;
  color: white;
  border: 1px solid #6275a8;
  border-radius: 10px;
  font: inherit;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<main>

<h1>🧩 Wordbox Smart</h1>

<p>
  ارفع صورة شبكة اللعبة،
  وسنبحث عن كلمات عربية من
  4 أو 5 أو 6 حروف.
</p>

<label class="upload" for="file">
  📸 ارفع الصورة وابدأ الحل
</label>

<input
  id="file"
  type="file"
  accept="image/*"
>

<div id="status" role="status">
  بانتظار الصورة.
</div>

<div class="stage" id="stage">
  <img
    id="photo"
    alt="صورة اللعبة"
  >
</div>

<section class="panel">

<label for="length">
  طول الكلمات:
</label>

<select id="length">
  <option value="all">
    كل الأطوال (4 و5 و6)
  </option>

  <option value="4">
    4 حروف
  </option>

  <option value="5">
    5 حروف
  </option>

  <option value="6">
    6 حروف
  </option>
</select>

<h2>
  الكلمات:
  <span id="count">0</span>
</h2>

<div id="words"></div>

<p class="note">
  حتى 10 كلمات.
  يتم التحقق من اتصال الحروف،
  لكن قبول الكلمات في قاموس
  اللعبة غير مضمون.
</p>

</section>
</main>

<script>
const $ = id =>
  document.getElementById(id);

let allWords = [];

function showWords() {
  const selected = $('length').value;

  const words = allWords.filter(word => {
    return (
      selected === 'all' ||
      [...word].length === Number(selected)
    );
  }).slice(0, 10);

  $('count').textContent = words.length;

  $('words').replaceChildren();

  for (const word of words) {
    const cell =
      document.createElement('div');

    cell.className = 'word';
    cell.textContent = word;

    $('words').append(cell);
  }
}

$('length').addEventListener(
  'change',
  showWords
);

$('file').addEventListener(
  'change',
  async event => {
    const file =
      event.target.files?.[0];

    if (!file) return;

    $('status').textContent =
      '⏳ جاري قراءة الحروف والبحث عن الكلمات...';

    allWords = [];
    showWords();

    let url;

    try {
      url = URL.createObjectURL(file);

      const img = await new Promise(
        (resolve, reject) => {
          const picture = new Image();

          picture.onload = () =>
            resolve(picture);

          picture.onerror = reject;
          picture.src = url;
        }
      );

      const canvas =
        document.createElement('canvas');

      const scale = Math.min(
        1,
        1200 / Math.max(
          img.width,
          img.height
        )
      );

      canvas.width = Math.max(
        1,
        Math.round(img.width * scale)
      );

      canvas.height = Math.max(
        1,
        Math.round(img.height * scale)
      );

      canvas.getContext('2d').drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const image = canvas.toDataURL(
        'image/jpeg',
        0.8
      );

      $('photo').src = image;

      $('stage').style.display = 'block';

      const response = await fetch(
        '/.netlify/functions/solve',
        {
          method: 'POST',
          headers: {
            'Content-Type':
              'application/json'
          },
          body: JSON.stringify({image})
        }
      );

      const responseText =
        await response.text();

      let data;

      try {
        data = JSON.parse(responseText);
      } catch (_) {
        throw new Error(
          'الخادم أرجع ردًا غير مكتمل'
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error || 'تعذر التحليل'
        );
      }

      allWords = (
        Array.isArray(data.words)
          ? data.words
          : []
      ).map(item => {
        return typeof item === 'string'
          ? item
          : item.word;
      }).filter(Boolean);

      showWords();

      $('status').textContent =
        allWords.length
          ? `✅ انتهى التحليل. تم العثور على ${allWords.length} كلمة.`
          : 'لم يتم العثور على كلمات متصلة. جرّب صورة أوضح.';

    } catch (error) {
      $('status').textContent =
        'تعذر التحليل: ' +
        error.message;

    } finally {
      if (url) {
        URL.revokeObjectURL(url);
      }

      event.target.value = '';
    }
  }
);
</script>

</body>
</html>
