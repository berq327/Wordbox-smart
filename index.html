
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>Wordbox Smart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0e1425;
      color: #f5f7ff;
      font: 16px system-ui;
    }

    main {
      max-width: 580px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
    }

    p {
      color: #bdc9e0;
      line-height: 1.8;
    }

    .upload {
      display: block;
      background: #6c78f4;
      border-radius: 15px;
      padding: 18px;
      text-align: center;
      font-weight: 800;
      cursor: pointer;
    }

    input {
      display: none;
    }

    .panel {
      background: #1b2744;
      padding: 15px;
      border-radius: 18px;
      margin-top: 18px;
    }

    .stage {
      display: none;
      margin-top: 12px;
    }

    .stage img {
      width: 100%;
      display: block;
      border-radius: 12px;
    }

    #status {
      padding: 12px;
      border-radius: 10px;
      background: #233757;
      margin: 12px 0;
      line-height: 1.7;
    }

    #words {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .word {
      background: #2b3b60;
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      font-size: 21px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .note {
      font-size: 13px;
    }
  </style>
</head>

<body>
<main>
  <h1>🧩 Wordbox Smart</h1>

  <p>
    ارفع صورة شبكة Wordbox كاملة،
    والبرنامج يقرأ الحروف ويعرض الكلمات فقط.
  </p>

  <label class="upload" for="file">
    📸 ارفع الصورة وابدأ الحل
  </label>

  <input
    id="file"
    type="file"
    accept="image/*"
  >

  <div id="status" role="status">
    بانتظار الصورة.
  </div>

  <div class="stage" id="stage">
    <img
      id="photo"
      alt="صورة شبكة اللعبة"
    >
  </div>

  <section class="panel">
    <h2>
      الكلمات:
      <span id="count">0</span>
    </h2>

    <div id="words"></div>

    <p class="note">
      يعرض حتى 15 كلمة من 3 أحرف فأكثر.
      يتم التحقق من تجاور الحروف،
      لكن قبول الكلمات في قاموس Plato
      غير مضمون.
    </p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

$('file').onchange = async event => {
  const file = event.target.files?.[0];

  if (!file) return;

  $('status').textContent =
    '⏳ جاري قراءة الحروف والبحث عن الكلمات...';

  $('words').replaceChildren();
  $('count').textContent = '0';

  let url;

  try {
    url = URL.createObjectURL(file);

    const img = await new Promise(
      (resolve, reject) => {
        const picture = new Image();

        picture.onload = () => resolve(picture);
        picture.onerror = reject;
        picture.src = url;
      }
    );

    // تصغير الصورة لتخفيف حجم الإرسال
    const canvas = document.createElement('canvas');

    const scale = Math.min(
      1,
      1200 / Math.max(img.width, img.height)
    );

    canvas.width = Math.max(
      1,
      Math.round(img.width * scale)
    );

    canvas.height = Math.max(
      1,
      Math.round(img.height * scale)
    );

    canvas.getContext('2d').drawImage(
      img,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const image = canvas.toDataURL(
      'image/jpeg',
      0.8
    );

    $('photo').src = image;
    $('stage').style.display = 'block';

    const response = await fetch(
      '/.netlify/functions/solve',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({image})
      }
    );

    const responseText = await response.text();

    let data;

    try {
      data = JSON.parse(responseText);
    } catch (_) {
      throw new Error(
        'الخادم أرجع ردًا فارغًا أو غير مكتمل'
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error || 'تعذّر التحليل'
      );
    }

    const words = Array.isArray(data.words)
      ? data.words
      : [];

    $('count').textContent = String(words.length);

    for (const item of words) {
      const word = typeof item === 'string'
        ? item
        : item.word;

      if (!word) continue;

      const cell = document.createElement('div');

      cell.className = 'word';
      cell.textContent = word;

      $('words').append(cell);
    }

    $('status').textContent = words.length
      ? `✅ انتهى التحليل. عثرت على ${words.length} كلمة.`
      : 'لم أجد كلمات مؤكدة الاتصال. جرّب صورة أوضح.';

  } catch (error) {
    $('status').textContent =
      'تعذّر التحليل: ' + error.message;

  } finally {
    if (url) URL.revokeObjectURL(url);
    event.target.value = '';
  }
};
</script>
</body>
</html>
