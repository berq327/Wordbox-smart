<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wordbox Smart</title><style>body{margin:0;background:#0e1425;color:#f5f7ff;font:16px system-ui}main{max-width:580px;margin:auto;padding:20px}h1{font-size:26px}p{color:#bdc9e0;line-height:1.8}.upload{display:block;background:#6c78f4;border-radius:15px;padding:18px;text-align:center;font-weight:800;cursor:pointer}input{display:none}.panel{background:#1b2744;padding:15px;border-radius:18px;margin-top:18px}.stage{position:relative;display:none}.stage img{width:100%;display:block;border-radius:12px}.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#status{padding:12px;border-radius:10px;background:#233757;margin:12px 0}.word{display:flex;justify-content:space-between;align-items:center;background:#2b3b60;border:0;color:white;border-radius:10px;padding:13px;width:100%;margin:7px 0;font-size:19px;cursor:pointer}.word small{font-size:12px;color:#b8e9e0}#words{max-height:480px;overflow:auto}.note{font-size:13px}</style><main><h1>🧩 Wordbox Smart</h1><p>صوّر شبكة Wordbox كاملة وارفع الصورة. بدون إدخال حروف أو تحديد مربعات.</p><label class="upload" for="file">📸 ارفع الصورة وابدأ الحل</label><input id="file" type="file" accept="image/*"><div id="status">بانتظار الصورة.</div><div class="stage" id="stage"><img id="photo"><svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div><section class="panel"><h2>الكلمات: <span id="count">0</span></h2><div id="words"></div><p class="note">نتائج النموذج ليست ضمانًا لقبول الكلمة في قاموس Plato. يُتحقق آليًا من تجاور مسار كل كلمة.</p></section></main><script>
const $=id=>document.getElementById(id);let result=null;function draw(path){const svg=$('overlay'),b=result.bounds;if(!b||![b.left,b.right,b.top,b.bottom].every(Number.isFinite)){svg.innerHTML='';return}let points=path.map(i=>[100*(b.left+(b.right-b.left)*(i%4)/3),100*(b.top+(b.bottom-b.top)*Math.floor(i/4)/3)]);svg.innerHTML='<polyline points="'+points.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#20ffd1" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'+points.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.2" fill="#ffffff" stroke="#007e74" stroke-width=".8"/><text x="'+p[0]+'" y="'+(p[1]+1)+'" font-size="2.5" text-anchor="middle" fill="#07322f">'+(i+1)+'</text>').join('')}
$('file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;let img=await new Promise((ok,no)=>{let x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=URL.createObjectURL(f)});let canvas=document.createElement('canvas');let s=Math.min(1,1500/Math.max(img.width,img.height));canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let image=canvas.toDataURL('image/jpeg',.83);$('photo').src=image;$('stage').style.display='block';$('overlay').innerHTML='';$('words').innerHTML='';$('count').textContent='0';$('status').textContent='⏳ جاري قراءة الصورة واستخراج الكلمات...';try{let r=await fetch('/.netlify/functions/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image})});let j=await r.json();if(!r.ok)throw Error(j.error||'تعذر التحليل');result=j;$('count').textContent=j.words.length;$('status').textContent=j.grid.includes('?')?'بعض الحروف غير واضحة، وقد تكون النتائج ناقصة.':'انتهى التحليل. اضغط كلمة لإظهار مسارها.';for(let w of j.words){let btn=document.createElement('button');btn.className='word';btn.innerHTML='<b></b><small>عرض المسار</small>';btn.querySelector('b').textContent=w.word;btn.onclick=()=>{draw(w.path);$('stage').scrollIntoView({behavior:'smooth',block:'center'})};$('words').append(btn)}if(!j.words.length)$('status').textContent='لم أجد كلمات موثوقة بمسارات متصلة في هذه الصورة.'}catch(err){$('status').textContent='تعذر التحليل: '+err.message}}
</script></html>
